# Zratro OS Configuration File
# This file is read by the kernel at boot time to determine which programs to run.

# System configuration
hostname = zratro

# Time slice in milliseconds
time_slice = 10

# Programs to run at startup
# Each line starting with "program" specifies a program to launch

program = /prgm/sys/init
program = /prgm/sys/desk
#program = /prgm/sys/shell

# You can also specify programs with their arguments:
# program = /bin/app --arg1 --arg2

# Enable debug output
debug = true
