timeout: 0
serial: yes
verbose: yes

/Zratro OS
    protocol: limine
    kernel_path: boot():/system/knl.bin
    kernel_cmdline: debug=on loglevel=7 console=ttyS0,115200
    kaslr: no
    resolution: 1024x768
    module_path: boot():/system/zratro.conf
    module_path: boot():/system/internet/e1w.cfg
    module_path: boot():/system/firmware/rtl8188eufw.bin
    module_path: boot():/prgm/sys/init
    module_path: boot():/prgm/shell
    module_path: boot():/prgm/sys/desk
    module_path: boot():/prgm/windowprogram/fm
    module_path: boot():/prgm/windowprogram/zinstall
    module_path: boot():/desktop/desktop.conf
    module_path: boot():/ini/usrroot/user.cfg
